name: Apply Patch to New Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'New branch name to create'
        required: true
        default: 'patch-updates'
      patch_path:
        description: 'Path to the patch file'
        required: false
        default: 'new.patch'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to new branch
        run: |
          git checkout -b "${{ inputs.branch_name }}"

      - name: Install patch tools
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix patch

      - name: Normalize line endings across repository and patch
        run: |
          # Convert both the patch and all repository source files to Unix line endings (LF)
          # This resolves the failure at line 1 on .csproj, .slnx, and .cs files
          dos2unix "${{ inputs.patch_path }}"
          find . -type f \( -name "*.cs" -o -name "*.csproj" -o -name "*.sln*" -o -name "*.md" -o -name "*.xaml*" \) -exec dos2unix {} +

      - name: Remove pre-existing files that the patch creates from scratch
        run: |
          # Prevents "already exists in working directory" collisions
          awk '/^diff --git / { file=$4; sub(/^b\//, "", file) } /^new file mode/ { if (file) print file }' "${{ inputs.patch_path }}" | while read -r f; do
            if [ -n "$f" ] && [ -e "$f" ]; then
              rm -f "$f"
            fi
          done

      - name: Apply patch with GNU patch (no conflict markers)
        run: |
          # --batch: non-interactive
          # --ignore-whitespace: ignore space/tab differences
          # --fuzz=3: allows context lines to match even if line numbers shifted
          # GNU patch NEVER inserts <<<<<<< / >>>>>>> markers into code files
          patch -p1 --batch --ignore-whitespace --fuzz=3 < "${{ inputs.patch_path }}" || true

      - name: Check and clean reject files
        run: |
          REJECTS=$(find . -name "*.rej")
          if [ -n "$REJECTS" ]; then
            echo "::warning::Some hunks could not apply cleanly and were saved as .rej files:"
            echo "$REJECTS"
            # Remove reject (.rej) and original backup (.orig) files so they aren't committed
            find . -name "*.rej" -o -name "*.orig" -delete
          else
            echo "All patch changes applied cleanly with zero rejected hunks."
          fi

      - name: Commit and push new branch
        run: |
          git add -A
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Apply changes from ${{ inputs.patch_path }}"
            git push origin "${{ inputs.branch_name }}" --force
          else
            echo "No changes detected to commit."
          fi
