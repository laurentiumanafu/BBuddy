name: Apply Patch to New Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'New branch name to create'
        required: true
        default: 'patch-updates'
      patch_path:
        description: 'Path to the patch file'
        required: false
        default: 'new.patch'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Git can locate the commit the patch was based on
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Normalize patch formatting
        run: |
          # Strip carriage returns and UTF-8 BOM that break line 1 matches
          sed -i 's/\r$//' "${{ inputs.patch_path }}"
          sed -i '1s/^\xEF\xBB\xBF//' "${{ inputs.patch_path }}"

      - name: Locate base commit and branch
        run: |
          # Extract the original blob hash of the first modified file
          BLOB=$(awk '/^index [0-9a-fA-F]+\.\./ { split($2, a, ".."); print a[1]; exit }' "${{ inputs.patch_path }}")
          echo "Looking for base blob: $BLOB"

          BASE_COMMIT=""
          if [ -n "$BLOB" ]; then
            BASE_COMMIT=$(git log --all --find-object="$BLOB" --format="%H" -n 1)
          fi

          if [ -n "$BASE_COMMIT" ]; then
            echo "Found matching base commit: $BASE_COMMIT"
            git checkout -b "${{ inputs.branch_name }}" "$BASE_COMMIT"
          else
            echo "Warning: Specific blob not found in commit history. Creating branch from HEAD."
            git checkout -b "${{ inputs.branch_name }}"
          fi

      - name: Remove pre-existing files marked as new
        run: |
          # Clean untracked/pre-existing files that the patch creates from scratch
          awk '/^diff --git / { file=$4; sub(/^b\//, "", file) } /^new file mode/ { if (file) print file }' "${{ inputs.patch_path }}" | while read -r f; do
            if [ -n "$f" ] && [ -e "$f" ]; then
              rm -f "$f"
            fi
          done

      - name: Apply patch cleanly
        run: |
          # Fails immediately if lines don't match, preventing any conflict markers
          git apply --ignore-whitespace --whitespace=nowarn "${{ inputs.patch_path }}"

      - name: Commit and push new branch
        run: |
          git add -A
          git commit -m "Apply changes from ${{ inputs.patch_path }}"
          git push origin "${{ inputs.branch_name }}" --force
